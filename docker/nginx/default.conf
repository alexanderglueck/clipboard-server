# PRODUCTION nginx vhost (baked into clipboard-server-web:latest). The app image is
# php-fpm only, so this is what actually answers HTTP. Logs go to stdout/stderr so
# `docker logs` is the one place to look.
server {
    index index.php index.html;

    server_name _;
    server_tokens off;

    error_log  /dev/stderr warn;
    access_log /dev/stdout;

    root /app/public;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    client_max_body_size 16M;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass clipboard-server:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
